openapi: 3.1.0

info:
  title: ACE / CSKA CRM API
  version: 0.3.0
  summary: Sprints S1, S3 and S4 — access, directory, holds and cancellation.
  description: |
    Versioned API contract for the ACE / CSKA tennis-centre CRM.

    **Status: draft for contract review.** Covers:

    - **S1** — P01 access, P02 employees and permissions, P03 locations and
      resources.
    - **S3** — P07 availability and customer request, P09 schedule reads,
      P10 reservation approval queue. This is the confirmed customer journey:
      request, five-minute hold, employee decision (BR-04, BR-05, BR-06).
    - **S4** — P08 customer cancellation request and P11 administrator
      decision queue. Confirmed rules BR-07, BR-08 and BR-09: a request at
      least two hours before start, administrator approval, the slot held
      while pending, and no automatic refund.

    S2 directory and catalog and the later financial sprints extend this
    document; `development/README.md` section 4 holds the full page inventory.

    This is a proposal for both teams to agree, not an owner-approved business
    rule set. Where a shape depends on an unresolved decision, the affected
    operation or field carries a `GATE` note naming the decision. Those parts
    must not be treated as implementation-ready.

    ## Conventions

    Defined in `development/README.md` section 8 and applied throughout:

    - Identity is derived server-side from the session. The client never
      supplies its own role, customer ownership or requester identity.
    - Location is explicit on location-scoped calls and is checked server-side.
      Absence of a capability grant means denial.
    - List endpoints use documented pagination with stable ordering. `total`
      counts all matching records, not the current page.
    - Mutable records carry an integer `version` and an `ETag`. Mutations
      require `If-Match`; a stale value fails with `VERSION_CONFLICT` rather
      than silently overwriting.
    - Instants are ISO 8601 with offset. Containers and the database run in
      UTC; `Asia/Almaty` is the business timezone for display, report
      boundaries and recurrence expansion.
    - Errors use one shape, `Error`. No stack traces and no personal data.

    ## Error codes

    From `development/README.md` section 8:
    `SLOT_UNAVAILABLE`, `HOLD_EXPIRED`, `CANCELLATION_CUTOFF_PASSED`,
    `INVALID_TRANSITION`, `VERSION_CONFLICT`, `CAPACITY_EXCEEDED`,
    `PAYMENT_ALREADY_APPLIED`, `REFUND_LIMIT_EXCEEDED`.

    Proposed additions needed by S1, for review — section 8 lists domain codes
    only and does not cover access or this sprint's constraints:
    `INVALID_CREDENTIALS`, `ACCOUNT_BLOCKED`, `RATE_LIMITED`,
    `NOT_AUTHENTICATED`, `FORBIDDEN`, `VALIDATION_FAILED`, `NOT_FOUND`,
    `LAST_POWER_USER_PROTECTED`, `RESOURCE_LOCATION_MISMATCH`,
    `CLOSURE_CONFLICTS_BOOKINGS`, `IDEMPOTENCY_KEY_REUSED`.

    ## Open questions this draft surfaces

    1. **Opening hours across midnight.** Courts run 07:00–00:00 and a 00:00
       end belongs to the next calendar date. This draft models that as
       `closes_at` plus an explicit `closes_next_day` flag rather than a
       `24:00` string, so no consumer has to parse an out-of-range time. Needs
       confirmation.
    2. **Pagination style.** `limit`/`offset` with a `total` is proposed for
       directory endpoints. Finance and audit lists in later sprints may need
       cursor pagination for stable paging over changing data; deciding now
       avoids two styles.
    3. **Employee identifier for sign-in.** `identifier` is deliberately
       opaque here — whether staff sign in by email, phone or username is part
       of D-02 and must not be fixed by this contract.
    4. **Rejection reason.** Optional on `POST /reservations/{id}/reject`.
       `ui-ux.md` section 6 forbids requiring a reason because a designer
       assumed one, so the policy must be stated here rather than inferred.
       Making it mandatory is a business decision not yet taken.
    5. **Allowed durations.** `GET /availability` returns the permitted
       durations rather than letting a client offer arbitrary intervals. The
       demo offered 30 minutes to five hours in half-hour steps; the real
       list, and any per-customer limit, is D-06.

  contact:
    name: Specification repository
    url: https://github.com/d9293/crm.docs
  license:
    name: Proprietary — all rights reserved by the owner
    identifier: LicenseRef-Proprietary

servers:
  - url: /api/v1
    description: Versioned base path. Breaking changes require a new major path.

tags:
  - name: Access
    description: Sign in, session state and current user. Page P01.
  - name: Employees
    description: Staff accounts, roles and capability grants. Page P02.
  - name: Locations
    description: ACE and CSKA. Page P03.
  - name: Resources
    description: Courts, rooms, operating hours and closures. Page P03.
  - name: Metadata
    description: Role and capability catalogue for permission-aware UI.
  - name: Availability
    description: Free time for booking, without disclosing other customers. Page P07.
  - name: Reservations
    description: |
      Customer request, five-minute hold and employee decision. Pages P07–P10.
      Confirmed rules BR-04, BR-05 and BR-06; acceptance tests AC-01 to AC-04.
  - name: Cancellations
    description: |
      Customer cancellation request and administrator decision. Pages P08 and
      P11. Confirmed rules BR-07, BR-08 and BR-09; acceptance tests AC-05 and
      AC-06.

security:
  - sessionCookie: []

paths:
  # ===========================================================================
  # Access — P01 / BE-01
  # ===========================================================================
  /session:
    post:
      operationId: createSession
      tags: [Access]
      summary: Sign in
      description: |
        Establishes a session and sets the session cookie. The response body
        carries no token: the session lives in a `Secure`, `HttpOnly` cookie,
        so client JavaScript cannot read it and cannot persist it to
        browser-readable storage.

        Failure is deliberately uninformative. Wrong password, unknown account
        and blocked account all return `INVALID_CREDENTIALS` with the same
        message, so the endpoint cannot be used to discover whether an account
        exists. `ACCOUNT_BLOCKED` is returned only once credentials have
        already been proven correct.

        Throttled per `development/infra.md` INF-02. Throttling must apply to
        this endpoint even when the backend port is addressed directly.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              additionalProperties: false
              properties:
                identifier:
                  type: string
                  minLength: 1
                  maxLength: 320
                  description: |
                    Account identifier. Deliberately opaque: whether staff and
                    customers sign in by email, phone or username is D-02.
                    GATE D-02.
                  examples: ["operator.ace"]
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 1024
      responses:
        "201":
          description: Session established.
          headers:
            Set-Cookie:
              description: |
                `crm_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/`.
                `Secure` is omitted only on plain-HTTP local development.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: |
            Invalid credentials. Identical response for wrong password and
            unknown account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid:
                  value:
                    code: INVALID_CREDENTIALS
                    message: Неверный логин или пароль.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5c90
        "403":
          description: Credentials correct but the account is blocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                blocked:
                  value:
                    code: ACCOUNT_BLOCKED
                    message: Доступ к учётной записи заблокирован.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5c91
        "429": { $ref: "#/components/responses/RateLimited" }

    get:
      operationId: getSession
      tags: [Access]
      summary: Current session and user
      description: |
        Used on application start to restore a session. Returns the same body
        as sign-in. A revoked or expired session returns 401 so the client can
        clear protected views and caches, per `frontend.md` FE-01.
      responses:
        "200":
          description: Active session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }

    delete:
      operationId: deleteSession
      tags: [Access]
      summary: Sign out
      description: |
        Revokes the current session server-side and clears the cookie.
        Idempotent: signing out an already-ended session still returns 204, so
        a client cannot be left unable to complete sign-out.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: |
            Session ended. Also returned when there was no active session, so
            a client can always complete sign-out.
          headers:
            Set-Cookie:
              description: Expired cookie clearing `crm_session`.
              schema: { type: string }
        "403":
          description: |
            Missing or invalid CSRF token. Sign-out is idempotent with respect
            to session state but still requires CSRF, so a third-party site
            cannot force a user to be signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me:
    get:
      operationId: getCurrentUser
      tags: [Access]
      summary: Current user, capabilities and permitted locations
      description: |
        Authoritative source for what the signed-in actor may do. The frontend
        uses it to decide which destinations and actions to render, but every
        API denial must still be handled — `frontend.md` is explicit that UI
        hiding is not enforcement.

        Re-fetch after a permission change: grant updates invalidate affected
        sessions or caches immediately (BE-02).
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }

  # ===========================================================================
  # Metadata
  # ===========================================================================
  /meta/capabilities:
    get:
      operationId: listCapabilities
      tags: [Metadata]
      summary: Capability and role-preset catalogue
      description: |
        Drives the P02 permission editor without hard-coding capability names
        in the frontend. Capability list follows `development/README.md`
        section 7.

        Role preset defaults are **not** settled: exactly what an
        Administrator, Operator or Coach may do by default is D-04. Until
        resolved, `presets` may be returned empty rather than guessed.
        GATE D-04.
      responses:
        "200":
          description: Catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, presets]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: "#/components/schemas/CapabilityDescriptor" }
                  presets:
                    type: array
                    description: Empty until D-04 is resolved.
                    items: { $ref: "#/components/schemas/RolePreset" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===========================================================================
  # Employees — P02 / BE-02
  # ===========================================================================
  /employees:
    get:
      operationId: listEmployees
      tags: [Employees]
      summary: List employees
      description: |
        Requires `employees.manage`. Results are scoped to locations the actor
        may administer. Ordering is stable (`full_name`, then `id`) so
        pagination cannot skip or repeat a row while data changes.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: query
          in: query
          description: Case-insensitive match on name. ICU collation handles Cyrillic.
          schema: { type: string, maxLength: 200 }
        - name: location_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: access_state
          in: query
          schema: { $ref: "#/components/schemas/AccessState" }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/RoleKey" }
      responses:
        "200":
          description: Paginated employees.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/EmployeeSummary" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createEmployee
      tags: [Employees]
      summary: Create an employee
      description: |
        Requires `employees.manage`. The caller cannot set the initial
        credential directly; onboarding and first-use flow are D-02, so this
        operation creates the account and its grants only.

        GATE D-02 for how the employee receives access.
        GATE D-04 for which `role` values are accepted and what they imply.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeWrite" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /employees/{employee_id}:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      operationId: getEmployee
      tags: [Employees]
      summary: Employee detail
      responses:
        "200":
          description: Employee.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updateEmployee
      tags: [Employees]
      summary: Update an employee
      description: |
        Requires `employees.manage` and `If-Match`. Omitted fields are left
        unchanged; `null` is not a way to clear a required field.

        Removing the last active Power User is refused with
        `LAST_POWER_USER_PROTECTED` — a system with no Power User cannot
        restore its own administration.

        Changing grants or access state revokes the affected employee's
        sessions immediately. The response reports how many were ended so the
        UI can state the consequence plainly instead of implying it.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeWrite" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Stale `If-Match` (`VERSION_CONFLICT`), or the change would remove
            the last active Power User (`LAST_POWER_USER_PROTECTED`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                version:
                  summary: Stale version
                  value:
                    code: VERSION_CONFLICT
                    message: Запись изменена другим пользователем. Обновите данные.
                    current_version: 7
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5c92
                last_power_user:
                  summary: Last Power User protected
                  value:
                    code: LAST_POWER_USER_PROTECTED
                    message: Нельзя снять последнего пользователя с полными правами.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5c93
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /employees/{employee_id}/archive:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      operationId: archiveEmployee
      tags: [Employees]
      summary: Archive an employee
      description: |
        Archive, not delete. There is deliberately no hard-delete operation:
        an employee is referenced as the actor on bookings, payments and audit
        events, and removing the row would destroy that history.

        Archiving blocks access and revokes sessions while preserving every
        actor reference.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Stale version or last Power User protected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /employees/{employee_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    delete:
      operationId: revokeEmployeeSessions
      tags: [Employees]
      summary: Revoke all sessions for an employee
      description: |
        Ends every active session for the employee across devices. Separate
        from blocking: an administrator may need to end sessions without
        removing access, for example on a lost device.

        Verified by BE-01 acceptance — a blocked or revoked account cannot
        continue using a previously issued session.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked_session_count, server_time]
                properties:
                  revoked_session_count: { type: integer, minimum: 0 }
                  server_time: { $ref: "#/components/schemas/Instant" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # Locations — P03 / BE-03
  # ===========================================================================
  /locations:
    get:
      operationId: listLocations
      tags: [Locations]
      summary: List locations
      description: |
        Returns only locations the actor may access. An ACE-only employee
        never sees CSKA here, and must not be able to reach CSKA data by
        supplying its ID elsewhere — AC-11.
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Permitted locations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Location" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }

    post:
      operationId: createLocation
      tags: [Locations]
      summary: Create a location
      description: Requires `locations.manage` (Power User).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationWrite" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /locations/{location_id}:
    parameters:
      - $ref: "#/components/parameters/LocationId"
    get:
      operationId: getLocation
      tags: [Locations]
      summary: Location detail
      responses:
        "200":
          description: Location.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updateLocation
      tags: [Locations]
      summary: Update a location
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationWrite" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ===========================================================================
  # Resources — P03 / BE-03
  # ===========================================================================
  /locations/{location_id}/resources:
    parameters:
      - $ref: "#/components/parameters/LocationId"
    get:
      operationId: listResources
      tags: [Resources]
      summary: List bookable resources at a location
      description: |
        Ordered by `display_order`, then `id`. The demo showed ten tennis
        courts plus Fitness and Assembly Hall at ACE; actual inventory is
        imported only after validation (BE-03).
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ResourceKind" }
      responses:
        "200":
          description: Resources.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Resource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      operationId: createResource
      tags: [Resources]
      summary: Create a resource
      description: |
        Requires `resources.manage` for the location. The resource belongs to
        the location in the path; a mismatched `location_id` in the body is
        refused with `RESOURCE_LOCATION_MISMATCH` rather than silently
        preferring one of the two.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceWrite" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /resources/{resource_id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getResource
      tags: [Resources]
      summary: Resource detail
      responses:
        "200":
          description: Resource.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updateResource
      tags: [Resources]
      summary: Update a resource
      description: |
        Archiving a resource with future allocations must follow approved
        policy and cannot silently cancel paid bookings (BE-03). Where the
        change would affect existing reservations the server returns
        actionable detail rather than applying it quietly.

        GATE D-06 for how closures and archival interact with existing
        bookings.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceWrite" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /resources/{resource_id}/closures:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: listResourceClosures
      tags: [Resources]
      summary: List closures for a resource
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: "#/components/schemas/LocalDate" }
        - name: to
          in: query
          required: true
          description: Inclusive. Interpreted in the location's business timezone.
          schema: { $ref: "#/components/schemas/LocalDate" }
      responses:
        "200":
          description: Closures.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Closure" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      operationId: createResourceClosure
      tags: [Resources]
      summary: Close a resource for a period
      description: |
        Closures use half-open instants `[starts_at, ends_at)`, the same
        convention as reservations, so a closure ending at 11:00 does not
        collide with a booking starting at 11:00.

        If the period overlaps existing confirmed bookings the server returns
        409 `CLOSURE_CONFLICTS_BOOKINGS` listing them, rather than cancelling
        them. Resolving those bookings is a separate, deliberate act.

        From S3 this shares the BE-06 allocation engine, so a closure and a
        booking cannot both claim the same interval.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClosureWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Closure" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The period overlaps existing bookings.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      conflicts:
                        type: array
                        description: Conflicting allocations, so the UI can name exact dates.
                        items:
                          type: object
                          properties:
                            reservation_id: { $ref: "#/components/schemas/Id" }
                            starts_at: { $ref: "#/components/schemas/Instant" }
                            ends_at: { $ref: "#/components/schemas/Instant" }
              examples:
                conflict:
                  value:
                    code: CLOSURE_CONFLICTS_BOOKINGS
                    message: В выбранный период есть подтверждённые брони.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5c94
                    conflicts:
                      - reservation_id: 4821
                        starts_at: "2026-11-02T04:00:00Z"
                        ends_at: "2026-11-02T05:30:00Z"
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ===========================================================================
  # Availability — P07 / BE-06
  # ===========================================================================
  /availability:
    get:
      operationId: getAvailability
      tags: [Availability]
      summary: Free time for a location and date
      description: |
        Returns bookable intervals for one calendar date at one location, plus
        the permitted durations and the current server time.

        **Advisory only.** `README.md` section 6 is explicit that availability
        is advisory and mutations recheck atomically. A slot returned here may
        be taken a moment later; the request endpoint is the only authority.

        **No other customer is disclosed.** An occupied interval is reported as
        unavailable with no customer identity, booking reference or group name.
        Section 7 requires that customers never see another customer's identity
        in availability responses, and a staff caller receives only the private
        fields their capabilities permit.

        **Expired holds do not block.** A pending hold whose expiry has passed
        is excluded here regardless of whether the sweeper has run, which is
        what makes AC-02 pass with the cleanup worker stopped.

        `server_time` is returned so a client can anchor a countdown without
        trusting the device clock.
      parameters:
        - name: location_id
          in: query
          required: true
          description: Checked server-side against the caller's permitted locations.
          schema: { $ref: "#/components/schemas/Id" }
        - name: date
          in: query
          required: true
          description: |
            Calendar date in the location's business timezone. Court hours run
            07:00–00:00, and the 00:00 end belongs to the following date.
          schema: { $ref: "#/components/schemas/LocalDate" }
        - name: resource_ids
          in: query
          description: Restrict to these resources. All permitted resources when omitted.
          schema:
            type: array
            items: { $ref: "#/components/schemas/Id" }
          style: form
          explode: false
        - name: duration_minutes
          in: query
          description: |
            Show only intervals where this duration fits. 90 is supported
            (BR-12). GATE D-06 for the permitted list and any customer limit.
          schema: { type: integer, minimum: 30, maximum: 300 }
      responses:
        "200":
          description: Availability for the requested date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityResponse" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ===========================================================================
  # Reservations — P07–P10 / BE-06, BE-07
  # ===========================================================================
  /reservations:
    get:
      operationId: listReservations
      tags: [Reservations]
      summary: List reservations within the caller's scope
      description: |
        Scope is derived from the session, never from a query parameter. A
        customer with `reservations.read_own` receives only their own records; a
        staff caller with `reservations.read` receives records for permitted
        locations. A customer cannot widen the scope by supplying another
        customer's id — AC-11.

        Serves three screens: the customer's own list (P08), the staff schedule
        (P09), and the approval queue (P10) via
        `state=pending_confirmation`. The queue is ordered by
        `hold_expires_at` ascending by default, so the most urgent request is
        first, per the journey in `ui-ux.md` section 6.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: location_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: state
          in: query
          description: Repeatable. Several states may be requested at once.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ReservationState" }
          style: form
          explode: false
        - name: from
          in: query
          description: Inclusive lower bound on `starts_at`.
          schema: { $ref: "#/components/schemas/Instant" }
        - name: to
          in: query
          description: Exclusive upper bound on `starts_at`.
          schema: { $ref: "#/components/schemas/Instant" }
        - name: order
          in: query
          schema:
            type: string
            enum: [hold_expiry_asc, starts_at_asc, starts_at_desc]
            default: starts_at_asc
      responses:
        "200":
          description: Paginated reservations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    required: [items, server_time]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ReservationSummary" }
                      server_time:
                        allOf:
                          - $ref: "#/components/schemas/Instant"
                          - description: |
                              Anchor for hold countdowns in the queue. Lets a
                              client compute remaining time without trusting
                              the device clock.
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reservations/requests:
    post:
      operationId: createReservationRequest
      tags: [Reservations]
      summary: Customer requests a court, creating a five-minute hold
      description: |
        Confirmed behaviour (BR-04): accepting the request immediately holds the
        requested court and time for five minutes pending an employee decision.

        **The server sets everything that matters.** It resolves the customer
        from the session and computes `hold_expires_at` as its own
        request-acceptance time plus 300 seconds. A caller cannot supply the
        customer, requester, state or expiry; those fields are absent from the
        request body by design, not merely ignored.

        **Allocation is atomic and all-or-nothing.** The server rejects any
        request overlapping a confirmed allocation or an unexpired hold. A
        failed multi-resource request leaves no partial allocation (AC-01). On
        conflict the response carries the conflicting intervals so the client
        can refresh availability and preserve the user's other selections
        rather than discarding the whole form.

        **Idempotency is required.** `Idempotency-Key` is mandatory here: a
        double-click or a retried request must produce one hold, not two
        (AC-01). A retry returns the original reservation unchanged and **does
        not extend the hold** — the five minutes run from the first acceptance,
        so a client cannot buy time by retrying.

        **No payment is involved.** BR-06 keeps reservation state and financial
        state separate; nothing here charges or requires money.

        Withdrawal of a pending request, active-hold limits and advance-booking
        limits are **not** part of this operation. GATE D-06 — they must not be
        inferred as implicit features.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationRequestWrite" }
      responses:
        "201":
          description: |
            Hold created, awaiting an employee decision. `server_time` and
            `hold_expires_at` together let the client show an accurate
            countdown; the countdown is informational, and only the server
            decides whether the hold is still live.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
              examples:
                pending:
                  value:
                    id: 5120
                    state: pending_confirmation
                    location_id: 1
                    customer_id: 100
                    starts_at: "2026-10-26T04:00:00Z"
                    ends_at: "2026-10-26T05:30:00Z"
                    requested_at: "2026-10-26T03:12:07Z"
                    hold_expires_at: "2026-10-26T03:17:07Z"
                    server_time: "2026-10-26T03:12:07Z"
                    allocations:
                      - resource_id: 11
                        resource_name: Корт 1
                        starts_at: "2026-10-26T04:00:00Z"
                        ends_at: "2026-10-26T05:30:00Z"
                    price_snapshot:
                      currency: KZT
                      total_minor_units: 1500000
                      lines:
                        - label: Аренда корта, 90 минут
                          quantity: 1
                          unit_price_minor_units: 1500000
                          amount_minor_units: 1500000
                          tariff_version_id: 44
                    # False for the requesting customer: deciding is an
                    # employee action. The same reservation read by an
                    # authorized operator returns true for both.
                    can_confirm: false
                    can_reject: false
                    # Cancellation applies to a confirmed booking, not a
                    # pending request.
                    can_request_cancellation: false
                    version: 1
        "200":
          description: |
            Idempotent replay. The original reservation, with its original
            `hold_expires_at` — the hold is never extended by a retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403":
          description: |
            The caller lacks `reservations.request`, or is not linked to the
            customer identity the request would act for.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `SLOT_UNAVAILABLE` — the interval overlaps a confirmed allocation
            or an unexpired hold. Nothing was allocated.

            `IDEMPOTENCY_KEY_REUSED` — the key was already used with a
            different request body. Section 8 makes this a conflict rather
            than a silent replay of unrelated input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlotConflictError" }
              examples:
                taken:
                  value:
                    code: SLOT_UNAVAILABLE
                    message: Это время уже занято. Выберите другое.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5cb0
                    server_time: "2026-10-26T03:12:07Z"
                    conflicts:
                      - resource_id: 11
                        resource_name: Корт 1
                        starts_at: "2026-10-26T04:00:00Z"
                        ends_at: "2026-10-26T05:00:00Z"
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /reservations/{reservation_id}:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    get:
      operationId: getReservation
      tags: [Reservations]
      summary: Reservation detail
      description: |
        Private fields are returned only to the extent the caller's
        capabilities permit; the server omits unauthorized fields rather than
        relying on the client to hide them.

        A customer requesting another customer's reservation receives a denial.
        Per section 8 the choice between 403 and 404 must be consistent for
        this operation so the status code cannot be used to probe for
        existence; **404** is used here, since the existence of someone else's
        booking is itself private.

        An expired request remains readable as a historical record. It must
        never be presented as confirmable — `state` is `expired` and
        `can_confirm` is false.
      responses:
        "200":
          description: Reservation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations/{reservation_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    post:
      operationId: confirmReservation
      tags: [Reservations]
      summary: Employee confirms a pending request
      description: |
        Confirmed behaviour (BR-05, BR-06): an employee decision within the
        hold confirms the reservation, and confirmation requires no payment.

        **Timing is strict.** Confirmation succeeds only while server time is
        *strictly before* `hold_expires_at`. At exactly the expiry instant the
        hold is already inactive, even if its stored status has not yet been
        swept to `expired` (`README.md` section 6). The server re-reads
        database time *after* acquiring locks, so a slow request cannot
        confirm a hold that expired while it waited.

        **One outcome only.** Confirm, reject and expiry serialize; exactly one
        wins and the others observe the final state (AC-03). A second decision
        returns the committed outcome rather than overwriting it.

        `If-Match` is required so a stale client — one whose view predates
        another employee's decision — fails with a conflict and refreshed
        state instead of acting on what it last saw.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: |
            Confirmed. The reservation is reserved regardless of payment; any
            `financial_summary` is independent and may show an unpaid balance
            (AC-04).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403":
          description: |
            The caller lacks `reservations.confirm`, or the reservation is at a
            location outside their assignment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `HOLD_EXPIRED` — server time has reached or passed
            `hold_expires_at`. An expired request can never be confirmed; the
            customer must submit a new one after rechecking availability.

            `INVALID_TRANSITION` — the reservation is no longer pending, for
            example another employee already decided.

            `VERSION_CONFLICT` — stale `If-Match`.

            Each carries `server_time` and the current state so the client can
            show an understandable result rather than an opaque failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationConflictError" }
              examples:
                expired:
                  value:
                    code: HOLD_EXPIRED
                    message: Время удержания истекло. Заявку нельзя подтвердить.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5cb1
                    server_time: "2026-10-26T03:17:07Z"
                    current_state: expired
                    current_version: 2
                already_decided:
                  value:
                    code: INVALID_TRANSITION
                    message: Заявку уже рассмотрел другой сотрудник.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5cb2
                    server_time: "2026-10-26T03:15:00Z"
                    current_state: confirmed
                    current_version: 2

  /reservations/{reservation_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    post:
      operationId: rejectReservation
      tags: [Reservations]
      summary: Employee rejects a pending request
      description: |
        Records the decision with actor, reason and timestamp, and releases all
        allocations in the same transaction, so the slot becomes available
        immediately rather than at the next sweep.

        A repeated rejection is harmless: the committed decision is returned
        and allocations are not released twice.

        The reason is **optional**. `ui-ux.md` section 6 warns against
        requiring one because a designer assumed it was needed; making it
        mandatory is a business decision not yet taken. Any reason shown to a
        customer must be safe to disclose.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
      responses:
        "200":
          description: Rejected and allocations released.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403":
          description: The caller lacks `reservations.reject` for this location.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `HOLD_EXPIRED`, `INVALID_TRANSITION` or `VERSION_CONFLICT`, as for
            confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationConflictError" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ===========================================================================
  # Cancellation — P08, P11 / BE-08
  # ===========================================================================
  /reservations/{reservation_id}/cancellation-requests:
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    post:
      operationId: createCancellationRequest
      tags: [Cancellations]
      summary: Customer requests cancellation of a confirmed reservation
      description: |
        Confirmed behaviour (BR-07, BR-08): a customer may request cancellation
        at least two hours before the reservation starts, an administrator
        decides, and the slot stays reserved while the request is pending.

        **The cutoff is enforced on the server, at submission.** The condition
        is `database_now <= starts_at - 2 hours`. For a 15:00 start, 13:00:00
        is accepted and 13:00:01 is not (AC-05). A customer who opened the form
        before the cutoff and submits after it is refused — the client's own
        clock and the moment the page loaded are both irrelevant.

        **The reservation does not change state.** It remains `confirmed` and
        keeps occupying its resources until a decision is made, so a pending
        request must never be displayed as though the booking were already
        cancelled or uncertain (BR-08, UX-04).

        **At most one active request per reservation.** A duplicate submission
        returns the existing request rather than creating a second, so a
        double-tap cannot produce two queue entries.

        **No money moves.** BR-09 is explicit that cancellation does not
        refund. This operation touches no payment, charge or entitlement.

        Whether a customer may resubmit after a rejection, and how a pending
        request interacts with rescheduling, are **D-07**. Do not infer either.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  allOf:
                    - $ref: "#/components/schemas/Reason"
                    - description: |
                        Customer's comment. Whether it is required is agreed
                        validation, not a designer's assumption.
      responses:
        "201":
          description: Request submitted. The reservation remains confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationRequest" }
              examples:
                pending:
                  value:
                    id: 311
                    reservation_id: 5120
                    state: pending
                    requested_at: "2026-10-26T07:45:00Z"
                    reservation_starts_at: "2026-10-26T10:00:00Z"
                    cancellation_cutoff_at: "2026-10-26T08:00:00Z"
                    reason: Не смогу прийти
                    server_time: "2026-10-26T07:45:00Z"
                    can_decide: false
                    version: 1
        "200":
          description: |
            An active request already exists. The existing record is returned
            rather than a second one being created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationRequest" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403":
          description: |
            The caller lacks `cancellations.request_own`, or the reservation
            belongs to another customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `CANCELLATION_CUTOFF_PASSED` — submission is later than
            `starts_at - 2 hours`. The response carries both `server_time` and
            `cancellation_cutoff_at` so the UI can explain precisely what was
            missed instead of blaming the user vaguely.

            `INVALID_TRANSITION` — the reservation is not confirmed; a pending,
            rejected, expired or already-cancelled booking cannot be
            cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationCutoffError" }
              examples:
                too_late:
                  value:
                    code: CANCELLATION_CUTOFF_PASSED
                    message: Отменить бронь можно не позднее чем за 2 часа до начала.
                    correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5cc0
                    server_time: "2026-10-26T08:00:01Z"
                    cancellation_cutoff_at: "2026-10-26T08:00:00Z"
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /cancellation-requests:
    get:
      operationId: listCancellationRequests
      tags: [Cancellations]
      summary: Cancellation requests within the caller's scope
      description: |
        Serves the P11 administrator queue, and a customer's view of their own
        requests. Scope comes from the session: a customer sees only their own,
        an administrator only permitted locations.

        Default ordering is by `reservation_starts_at` ascending — the booking
        starting soonest needs a decision soonest. This differs from the
        reservation approval queue, which orders by hold expiry, because a
        cancellation request has no expiry of its own. `README.md` section 6 is
        explicit that no second timeout should be invented for it.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: location_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: state
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/CancellationState" }
          style: form
          explode: false
      responses:
        "200":
          description: Paginated cancellation requests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageEnvelope"
                  - type: object
                    required: [items, server_time]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CancellationRequest" }
                      server_time: { $ref: "#/components/schemas/Instant" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /cancellation-requests/{cancellation_request_id}/approve:
    parameters:
      - $ref: "#/components/parameters/CancellationRequestId"
    post:
      operationId: approveCancellationRequest
      tags: [Cancellations]
      summary: Administrator approves a cancellation
      description: |
        Requires `cancellations.decide` and permission for the reservation's
        location — Administrator or Power User.

        One transaction records the decision, transitions the reservation to
        `canceled` and releases **all** its allocations, so the slot becomes
        bookable immediately rather than at the next sweep (BR-08).

        **No money moves.** BR-09: approval does not refund, write off debt, or
        touch payroll. Any financial consequence is a separate, explicit act
        governed by D-09. The confirmation UI must say so rather than offering
        an implicit refund checkbox.

        A duplicate approval must not release resources twice or emit duplicate
        events; the committed decision is returned instead.

        Whether an administrator may decide after the cutoff — or after the
        reservation has started — is **D-07**, as is staff override. Those
        paths are not specified here.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
      responses:
        "200":
          description: |
            Approved. The reservation is `canceled` and its resources are free.
            Any payment it had is unaffected and remains in financial totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationRequest" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `INVALID_TRANSITION` — already decided by another administrator.

            `VERSION_CONFLICT` — stale `If-Match`, including the case where the
            underlying booking changed since the request was read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cancellation-requests/{cancellation_request_id}/reject:
    parameters:
      - $ref: "#/components/parameters/CancellationRequestId"
    post:
      operationId: rejectCancellationRequest
      tags: [Cancellations]
      summary: Administrator rejects a cancellation
      description: |
        Records the decision and leaves the reservation exactly as it was:
        still `confirmed`, still occupying its resources (BR-08). No money
        moves in either direction.

        Whether the customer may submit a new request afterwards is **D-07**.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { $ref: "#/components/schemas/Reason" }
      responses:
        "200":
          description: Rejected. The booking is untouched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationRequest" }
        "401": { $ref: "#/components/responses/NotAuthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already decided, or stale `If-Match`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: |
        Opaque session identifier in a `Secure`, `HttpOnly`, `SameSite=Lax`
        cookie. Not readable by client JavaScript, which is why no token
        appears in any response body.

        State-changing requests additionally require the CSRF header — see the
        `CsrfToken` parameter. `SameSite=Lax` alone is not treated as
        sufficient protection.

        GATE D-01 for the final session strategy, cookie domain and CORS
        details, which depend on the chosen framework and deployment.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        CSRF token for state-changing requests, paired with the session
        cookie. Required on every POST, PATCH and DELETE.
      schema: { type: string, minLength: 1 }

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        `ETag` from the last read of this record. A stale value fails with
        409 `VERSION_CONFLICT` and the response carries `current_version`, so
        the client can show a conflict rather than overwrite another user's
        change.
      schema: { type: string }
      example: '"7"'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key for duplicate-prone commands. The server binds it
        to actor, operation and request digest, and a retry returns the
        original committed result. Reusing a key with different input is a
        conflict.

        Defined here for reuse; applies from S3 to reservation requests,
        financial commands, membership activation and attendance, per
        `development/README.md` section 8. No S1 operation needs it.
      schema: { type: string, format: uuid }

    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

    EmployeeId:
      name: employee_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

    LocationId:
      name: location_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

    CancellationRequestId:
      name: cancellation_request_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

  headers:
    ETag:
      description: Opaque record version for use in `If-Match`.
      schema: { type: string }

    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }

  responses:
    NotAuthenticated:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value:
                code: NOT_AUTHENTICATED
                message: Войдите в систему.
                correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5ca0

    Forbidden:
      description: |
        Authenticated but not permitted. The message must not disclose the
        name or existence of the hidden record — `ui-ux.md` section 10.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value:
                code: FORBIDDEN
                message: Недостаточно прав для этого действия.
                correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5ca1

    NotFound:
      description: |
        Record absent, or concealed from this actor. Section 8 permits 404 in
        place of 403 where ownership must stay concealed; the choice must be
        consistent per operation so response codes cannot be used to probe
        for existence.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ValidationFailed:
      description: Invalid input. `field_errors` maps field path to messages.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value:
                code: VALIDATION_FAILED
                message: Проверьте заполненные поля.
                field_errors:
                  closes_at: ["Окончание должно быть позже начала."]
                correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5ca2

    VersionConflict:
      description: Stale `If-Match`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value:
                code: VERSION_CONFLICT
                message: Запись изменена другим пользователем. Обновите данные.
                current_version: 4
                correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5ca3

    RateLimited:
      description: Too many attempts.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            default:
              value:
                code: RATE_LIMITED
                message: Слишком много попыток. Повторите позже.
                correlation_id: 018f3a2c-7b11-7c3e-9a44-6d2f1b8e5ca4

  schemas:
    # --- primitives ---------------------------------------------------------
    Id:
      type: integer
      format: int64
      minimum: 1
      description: Server-assigned identifier. Never supplied by a client on create.

    Instant:
      type: string
      format: date-time
      description: |
        ISO 8601 instant with offset, normally UTC. Business display and report
        boundaries use `Asia/Almaty`, applied by the consumer, not encoded here.

        `Asia/Almaty` is currently **UTC+5**: Kazakhstan unified its timezones
        on 1 March 2024, moving Almaty from UTC+6 to UTC+5. Instants before
        that date are still +06. Always convert through the IANA zone
        identifier and never write a fixed offset by hand — `+06:00` is an
        hour wrong for current data, and `+05:00` is an hour wrong for 2023
        data. This matters for migrated records under D-17.
      examples: ["2026-10-25T08:30:00Z"]

    LocalDate:
      type: string
      format: date
      description: |
        Calendar date with no time or offset. Used where a date must not shift
        under timezone conversion — birth dates and tariff effective dates in
        later sprints.
      examples: ["2026-10-25"]

    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Local wall-clock time in the location's business timezone.
      examples: ["07:00"]

    MinorUnits:
      type: integer
      format: int64
      description: |
        Monetary amount in integer minor units of `KZT` — 1 500 000 is 15 000
        tenge. `README.md` section 6 forbids binary floating point for money,
        so amounts are integers on the wire and the client formats for
        display. Negative values denote refunds and reversals.
      examples: [1500000]

    Version:
      type: integer
      minimum: 1
      description: Increments on every committed change. Mirrors the `ETag`.

    Reason:
      type: string
      maxLength: 1000
      description: |
        Free-text reason recorded on the audit event. Whether a reason is
        required per operation follows API policy — `ui-ux.md` section 6 is
        explicit that a designer must not require one by assumption.

    Error:
      type: object
      required: [code, message, correlation_id]
      description: |
        Single error shape, from `development/README.md` section 8. Carries no
        stack trace and no personal data.
      properties:
        code:
          type: string
          description: Stable machine-readable code. Clients branch on this, never on `message`.
        message:
          type: string
          description: Russian text safe to display to this actor.
        field_errors:
          type: object
          description: Field path to messages, for form-level display.
          additionalProperties:
            type: array
            items: { type: string }
        current_version:
          $ref: "#/components/schemas/Version"
        correlation_id:
          type: string
          description: Request correlation reference for support, safe to show to a user.

    PageEnvelope:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
          description: |
            All records matching the filter, not the page. Section 8 requires
            summary totals to cover the whole filtered set; pagination must
            never change an aggregate.
        limit: { type: integer }
        offset: { type: integer }

    # --- access -------------------------------------------------------------
    AccessState:
      type: string
      enum: [active, blocked, archived]
      description: |
        `blocked` and `archived` both end sessions and prevent sign-in.
        Archived additionally removes the employee from new assignment while
        preserving every actor reference on historical records.

    RoleKey:
      type: string
      enum: [power_user, administrator, operator, coach, customer]
      description: |
        Role presets from `development/README.md` section 7. `power_user` is
        the highest authority; the demo called this role Owner.

        A role is a preset for granting capabilities, not the authorization
        mechanism. Authorization is evaluated from explicit grants plus
        location and ownership scope, so absence of a grant means denial even
        for a high-ranking role. GATE D-04 for preset defaults.

    Capability:
      type: string
      description: |
        Capability key from `development/README.md` section 7. Not an enum
        here on purpose: the set grows each sprint, and pinning it in S1 would
        force a contract change for every new grant. Treat as an opaque
        string and fetch the catalogue from `/meta/capabilities`.
      examples: ["reservations.confirm"]

    CapabilityDescriptor:
      type: object
      required: [key, label, location_scoped]
      properties:
        key: { $ref: "#/components/schemas/Capability" }
        label: { type: string, description: Russian display label. }
        group: { type: string, description: Grouping for the permission editor. }
        location_scoped:
          type: boolean
          description: Whether the grant is evaluated per location.
        power_user_only:
          type: boolean
          description: |
            Capability that cannot be delegated. Delegation policy is D-04.

    RolePreset:
      type: object
      required: [role, label, capabilities]
      properties:
        role: { $ref: "#/components/schemas/RoleKey" }
        label: { type: string }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }

    CurrentUser:
      type: object
      required: [id, full_name, role, capabilities, locations, server_time]
      description: |
        Everything the client needs to choose a navigation shell and render
        permitted actions. `ui-ux.md` section 2 defines three shells: staff,
        customer and coach.
      properties:
        id: { $ref: "#/components/schemas/Id" }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/RoleKey" }
        capabilities:
          type: array
          description: |
            Effective capabilities after presets, explicit grants and scope.
            The frontend uses these to decide what to show; the server still
            enforces every call independently.
          items: { $ref: "#/components/schemas/Capability" }
        locations:
          type: array
          description: |
            Permitted locations only. An ACE-only employee receives ACE alone,
            and must not reach CSKA by supplying its ID elsewhere — AC-11.
          items: { $ref: "#/components/schemas/LocationSummary" }
        customer_id:
          description: |
            Set when the account is linked to a customer identity, for the
            customer shell. Linking requires verified ownership or an
            authorized employee action: a matching phone number alone must
            never link an account to an existing customer (BE-01).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        coach_id:
          description: Set when the account is linked to a coach profile.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        must_change_password:
          type: boolean
          description: |
            True after bootstrap or a reset, so the client can route to a
            change-password step. GATE D-02 for the full first-use flow.
        server_time:
          $ref: "#/components/schemas/Instant"

    # --- employees ----------------------------------------------------------
    EmployeeSummary:
      type: object
      required: [id, full_name, role, access_state, locations, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/RoleKey" }
        access_state: { $ref: "#/components/schemas/AccessState" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/LocationSummary" }
        version: { $ref: "#/components/schemas/Version" }

    Employee:
      allOf:
        - $ref: "#/components/schemas/EmployeeSummary"
        - type: object
          required: [capabilities, created_at]
          properties:
            phone:
              description: Display value as entered. Normalized separately for search (BE-04).
              oneOf:
                - type: string
                - type: "null"
            capabilities:
              type: array
              description: Explicit grants. Effective permissions combine these with the preset.
              items: { $ref: "#/components/schemas/Capability" }
            coach_id:
              description: |
                Linked coach profile, if any. A coach's business profile and
                login identity are separate linked records, never one row.
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            active_session_count:
              type: integer
              minimum: 0
              description: Lets the UI state plainly how many sessions a change will end.
            created_at: { $ref: "#/components/schemas/Instant" }
            archived_at:
              oneOf:
                - $ref: "#/components/schemas/Instant"
                - type: "null"

    EmployeeWrite:
      type: object
      additionalProperties: false
      description: |
        Create and update payload. On update, omitted fields are unchanged.
        `access_state` cannot be set to `archived` here — use the archive
        operation, so the action is explicit and auditable.
      properties:
        full_name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 32 }
        identifier:
          type: string
          maxLength: 320
          description: Sign-in identifier. GATE D-02.
        role: { $ref: "#/components/schemas/RoleKey" }
        access_state:
          type: string
          enum: [active, blocked]
        location_ids:
          type: array
          description: |
            Assigned locations. Determines the scope of every location-scoped
            capability. An empty array means no location access.
          items: { $ref: "#/components/schemas/Id" }
        capabilities:
          type: array
          description: Explicit grants in addition to the preset. GATE D-04.
          items: { $ref: "#/components/schemas/Capability" }
        coach_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        reason: { $ref: "#/components/schemas/Reason" }

    # --- locations ----------------------------------------------------------
    LocationSummary:
      type: object
      required: [id, name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, examples: ["ACE"] }

    Location:
      type: object
      required: [id, name, timezone, is_active, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone:
          type: string
          description: |
            IANA timezone for business display, report boundaries and
            recurrence expansion at this location. `Asia/Almaty` for both ACE
            and CSKA.

            Per-location rather than global because report boundaries must
            follow the location, not the workstation — and a future third
            location should not require a schema change.
          examples: ["Asia/Almaty"]
        address:
          oneOf:
            - type: string
            - type: "null"
        is_active: { type: boolean }
        version: { $ref: "#/components/schemas/Version" }

    LocationWrite:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string }
        address: { type: string, maxLength: 500 }
        is_active: { type: boolean }
        reason: { $ref: "#/components/schemas/Reason" }

    # --- resources ----------------------------------------------------------
    ResourceKind:
      type: string
      enum: [tennis_court, fitness, hall, other]
      description: |
        Bookable resource kind. Values follow the demo inventory: ten tennis
        courts plus Fitness and Assembly Hall at ACE.

        `frontend.md` FE-03 requires kinds whose customer-facing scope is
        unsettled to be hidden from customer booking until agreed, so this is
        not automatically a customer-selectable list.

    SurfacePlacement:
      type: string
      enum: [indoor, outdoor]
      description: Indoor or outdoor. Meaningful for courts; may be absent otherwise.

    OpeningHours:
      type: object
      required: [weekday, opens_at, closes_at, closes_next_day]
      description: |
        Operating hours for one weekday in the location's timezone. Courts run
        07:00–00:00.

        `closes_next_day` exists because a 00:00 close belongs to the next
        calendar date. Encoding it as a flag rather than a `24:00` string
        keeps `closes_at` a valid time that every client can parse, and makes
        the midnight case explicit instead of implied. Proposed — confirm in
        S0 review.
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601 weekday, Monday = 1.
        opens_at: { $ref: "#/components/schemas/LocalTime" }
        closes_at: { $ref: "#/components/schemas/LocalTime" }
        closes_next_day:
          type: boolean
          description: True when `closes_at` falls on the following date, e.g. 00:00.

    Resource:
      type: object
      required: [id, location_id, name, kind, display_order, is_active, opening_hours, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        location_id: { $ref: "#/components/schemas/Id" }
        name: { type: string, examples: ["Корт 1"] }
        kind: { $ref: "#/components/schemas/ResourceKind" }
        placement:
          oneOf:
            - $ref: "#/components/schemas/SurfacePlacement"
            - type: "null"
        display_order:
          type: integer
          description: Column order in the P09 schedule. Stable tiebreak is `id`.
        default_capacity:
          description: |
            Baseline participant capacity. Default is at most 12 per court and
            overcapacity is blocked (BR-13).

            How capacity behaves when a group spans several courts is **not**
            settled and must not be assumed to be 12 times the resource count.
            GATE D-12.
          oneOf:
            - type: integer
              minimum: 1
            - type: "null"
        is_active: { type: boolean }
        opening_hours:
          type: array
          items: { $ref: "#/components/schemas/OpeningHours" }
        version: { $ref: "#/components/schemas/Version" }
        archived_at:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"

    ResourceWrite:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/ResourceKind" }
        placement: { $ref: "#/components/schemas/SurfacePlacement" }
        display_order: { type: integer, minimum: 0 }
        default_capacity: { type: integer, minimum: 1 }
        is_active: { type: boolean }
        opening_hours:
          type: array
          items: { $ref: "#/components/schemas/OpeningHours" }
        reason: { $ref: "#/components/schemas/Reason" }

    Closure:
      type: object
      required: [id, resource_id, starts_at, ends_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        resource_id: { $ref: "#/components/schemas/Id" }
        starts_at: { $ref: "#/components/schemas/Instant" }
        ends_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: Exclusive. Half-open `[starts_at, ends_at)`, as for reservations.
        reason:
          oneOf:
            - type: string
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Instant"

    ClosureWrite:
      type: object
      required: [starts_at, ends_at]
      additionalProperties: false
      properties:
        starts_at: { $ref: "#/components/schemas/Instant" }
        ends_at: { $ref: "#/components/schemas/Instant" }
        reason: { $ref: "#/components/schemas/Reason" }

    # --- availability -------------------------------------------------------
    AvailabilitySlot:
      type: object
      required: [resource_id, starts_at, ends_at, is_available]
      description: |
        One candidate interval on one resource. Half-open `[starts_at,
        ends_at)`, so 10:00–11:00 and 11:00–12:00 do not conflict.
      properties:
        resource_id: { $ref: "#/components/schemas/Id" }
        starts_at: { $ref: "#/components/schemas/Instant" }
        ends_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: Exclusive.
        is_available: { type: boolean }
        unavailable_reason:
          description: |
            Why the interval cannot be booked. Deliberately coarse: a customer
            may learn that a slot is taken, never by whom. `held` and `booked`
            are not distinguished for customer callers, because the difference
            would reveal that someone is mid-request.
          oneOf:
            - type: string
              enum: [occupied, closed, outside_hours]
            - type: "null"

    DurationOption:
      type: object
      required: [minutes, is_allowed]
      properties:
        minutes:
          type: integer
          description: 90 is supported (BR-12).
        is_allowed:
          type: boolean
          description: |
            False when the duration exists but this caller may not select it.
            GATE D-06 for customer duration limits.

    AvailabilityResponse:
      type: object
      required: [location_id, date, timezone, server_time, resources, slots, durations]
      properties:
        location_id: { $ref: "#/components/schemas/Id" }
        date: { $ref: "#/components/schemas/LocalDate" }
        timezone:
          type: string
          description: The location's business timezone, for rendering local times.
          examples: ["Asia/Almaty"]
        server_time:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: |
                Anchor for any client countdown. A client must never derive
                remaining hold time from the device clock.
        resources:
          type: array
          description: Resources covered by this response, in display order.
          items: { $ref: "#/components/schemas/Resource" }
        slots:
          type: array
          items: { $ref: "#/components/schemas/AvailabilitySlot" }
        durations:
          type: array
          description: Permitted durations, rather than leaving the client to invent them.
          items: { $ref: "#/components/schemas/DurationOption" }

    # --- reservations -------------------------------------------------------
    ReservationState:
      type: string
      enum: [pending_confirmation, confirmed, rejected, expired, canceled]
      description: |
        `pending_confirmation → confirmed | rejected | expired`, and
        `confirmed → canceled` only through an authorized staff action or an
        approved cancellation request (S4).

        Paid and unpaid are **never** reservation states — BR-06 keeps
        financial status separate. Attendance and completion are likewise
        separate from approval state.

    ResourceAllocation:
      type: object
      required: [resource_id, starts_at, ends_at]
      description: |
        One occupied interval on one resource. A reservation may hold several;
        either all are allocated or none are, so a partial booking cannot
        exist.
      properties:
        resource_id: { $ref: "#/components/schemas/Id" }
        resource_name: { type: string }
        starts_at: { $ref: "#/components/schemas/Instant" }
        ends_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: Exclusive.

    PriceLine:
      type: object
      required: [label, quantity, unit_price_minor_units, amount_minor_units]
      description: |
        An immutable snapshot taken when the reservation was created. Later
        tariff edits never change it, so history keeps the price actually
        quoted (`README.md` section 9).
      properties:
        label:
          type: string
          description: Description as it was at the time, not a live catalog lookup.
        quantity: { type: integer, minimum: 1 }
        unit_price_minor_units: { $ref: "#/components/schemas/MinorUnits" }
        amount_minor_units: { $ref: "#/components/schemas/MinorUnits" }
        service_id: { $ref: "#/components/schemas/Id" }
        tariff_version_id:
          allOf:
            - $ref: "#/components/schemas/Id"
            - description: The exact rule version applied, for traceability.

    PriceSnapshot:
      type: object
      required: [currency, total_minor_units, lines]
      properties:
        currency:
          type: string
          enum: [KZT]
        total_minor_units: { $ref: "#/components/schemas/MinorUnits" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PriceLine" }

    FinancialSummary:
      type: object
      required: [charged_minor_units, received_minor_units, outstanding_minor_units]
      description: |
        Independent of reservation state. A confirmed reservation may be
        entirely unpaid, and that is not an error (AC-04). Returned only to
        callers with finance visibility; omitted otherwise rather than zeroed,
        since a zero would read as "nothing owed".
      properties:
        charged_minor_units: { $ref: "#/components/schemas/MinorUnits" }
        received_minor_units: { $ref: "#/components/schemas/MinorUnits" }
        outstanding_minor_units: { $ref: "#/components/schemas/MinorUnits" }

    ReservationSummary:
      type: object
      required: [id, state, location_id, starts_at, ends_at, allocations, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/ReservationState" }
        location_id: { $ref: "#/components/schemas/Id" }
        starts_at: { $ref: "#/components/schemas/Instant" }
        ends_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: |
                Exclusive. A local 00:00 end belongs to the next calendar date
                (BR-12, AC-07).
        allocations:
          type: array
          items: { $ref: "#/components/schemas/ResourceAllocation" }
        hold_expires_at:
          description: Present only while `state` is `pending_confirmation`.
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        customer_display_name:
          description: |
            Authorized staff only. Never present in a customer-scoped
            response about someone else's reservation.
          oneOf:
            - type: string
            - type: "null"
        version: { $ref: "#/components/schemas/Version" }

    Reservation:
      allOf:
        - $ref: "#/components/schemas/ReservationSummary"
        - type: object
          # Every `can_*` field is required. An absent boolean is falsy in
          # JavaScript, so omitting one would happen to hide the action — but
          # relying on that is fragile, and a client should never have to guess
          # whether the server declined to answer.
          required:
            [
              requested_at,
              server_time,
              can_confirm,
              can_reject,
              can_request_cancellation,
            ]
          properties:
            customer_id: { $ref: "#/components/schemas/Id" }
            requested_by_user_id:
              allOf:
                - $ref: "#/components/schemas/Id"
                - description: |
                    Who submitted it. Distinct from the customer: an employee
                    may act for a customer, and the audit trail must keep them
                    apart.
            requested_at: { $ref: "#/components/schemas/Instant" }
            decided_at:
              oneOf:
                - $ref: "#/components/schemas/Instant"
                - type: "null"
            decided_by_user_id:
              description: Authorized callers only.
              oneOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            decision_reason:
              description: |
                Only when safe to disclose to this caller. A reason written for
                internal use is not automatically customer-visible.
              oneOf:
                - type: string
                - type: "null"
            price_snapshot:
              oneOf:
                - $ref: "#/components/schemas/PriceSnapshot"
                - type: "null"
            financial_summary:
              description: Omitted entirely without finance visibility.
              oneOf:
                - $ref: "#/components/schemas/FinancialSummary"
                - type: "null"
            server_time:
              allOf:
                - $ref: "#/components/schemas/Instant"
                - description: |
                    Clock anchor. With `hold_expires_at` this is everything a
                    client needs for an accurate countdown that no device-clock
                    skew can distort.
            can_confirm:
              type: boolean
              description: |
                Server's own judgement, combining state, expiry against
                database time, and the caller's capabilities. False for an
                expired request, so a client cannot present it as confirmable
                even if it misreads the timestamps.
            can_reject:
              type: boolean
            cancellation_request_state:
              description: |
                Set when a cancellation request exists. A pending cancellation
                leaves the reservation `confirmed` and occupying its resources
                — the two states are shown together, never collapsed into one
                ambiguous status (UX-04).
              oneOf:
                - $ref: "#/components/schemas/CancellationState"
                - type: "null"
            cancellation_cutoff_at:
              description: |
                `starts_at` minus two hours — the latest instant at which a
                cancellation request is accepted (BR-07).

                Returned so the UI can state the exact deadline («Отмену можно
                запросить до 13:00, 25 октября») rather than computing it. A
                client doing its own arithmetic would show the wrong deadline
                whenever its clock or timezone is off, and UX-03 requires the
                customer to identify the cutoff correctly.
              oneOf:
                - $ref: "#/components/schemas/Instant"
                - type: "null"
            can_request_cancellation:
              type: boolean
              description: |
                The server's judgement, combining state, the cutoff against
                database time, ownership and whether an active request already
                exists.

                Like `can_confirm`, this exists so the client never decides.
                The action must disappear at the server-derived cutoff even if
                the browser believes there is still time.

    CancellationState:
      type: string
      enum: [pending, approved, rejected]
      description: |
        State of the cancellation *request*, which is a record separate from
        the reservation (BE-08). While `pending`, the reservation stays
        `confirmed` and keeps its resources — the two are never merged into a
        single status.

    CancellationRequest:
      type: object
      required:
        [
          id,
          reservation_id,
          state,
          requested_at,
          reservation_starts_at,
          cancellation_cutoff_at,
          server_time,
          can_decide,
          version,
        ]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        reservation_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/CancellationState" }
        requested_at: { $ref: "#/components/schemas/Instant" }
        reservation_starts_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: |
                Start time as it was when the request was submitted. Stored on
                the request so a later reschedule cannot silently change what
                the customer asked to cancel (BE-08).
        cancellation_cutoff_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: The two-hour deadline that applied to this request.
        reason:
          description: Customer's comment, where supplied and safe to show.
          oneOf:
            - type: string
            - type: "null"
        decided_at:
          oneOf:
            - $ref: "#/components/schemas/Instant"
            - type: "null"
        decided_by_user_id:
          description: Authorized callers only.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        decision_reason:
          oneOf:
            - type: string
            - type: "null"
        customer_display_name:
          description: Authorized staff only.
          oneOf:
            - type: string
            - type: "null"
        reservation:
          description: |
            Embedded booking context for the P11 queue, so deciding does not
            require a second request per row. Includes the payment summary only
            when the actor has finance visibility.
          oneOf:
            - $ref: "#/components/schemas/ReservationSummary"
            - type: "null"
        server_time: { $ref: "#/components/schemas/Instant" }
        can_decide:
          type: boolean
          description: |
            Whether this actor may decide this request now. False for a
            customer, and false once decided. Post-cutoff and post-start
            decision authority is D-07, so this field must not be read as
            settling it.
        version: { $ref: "#/components/schemas/Version" }

    CancellationCutoffError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            server_time:
              allOf:
                - $ref: "#/components/schemas/Instant"
                - description: |
                    The instant the server evaluated. With the cutoff below,
                    this lets the UI say exactly how late the submission was
                    instead of rejecting it without explanation.
            cancellation_cutoff_at: { $ref: "#/components/schemas/Instant" }

    ReservationRequestWrite:
      type: object
      required: [location_id, resource_ids, starts_at, ends_at]
      additionalProperties: false
      description: |
        Note what is absent and cannot be supplied: customer, requester, state,
        `hold_expires_at` and any price. The server derives identity from the
        session, computes expiry from its own clock and resolves price from the
        referenced tariff version. Accepting any of those from a client would
        let a caller book for someone else, extend its own hold or choose its
        own price.
      properties:
        location_id: { $ref: "#/components/schemas/Id" }
        resource_ids:
          type: array
          minItems: 1
          description: |
            All requested resources are occupied together, all-or-nothing.
            Whether multiple selected courts could instead mean "any one of
            these" is D-08 and is not supported here.
          items: { $ref: "#/components/schemas/Id" }
        starts_at: { $ref: "#/components/schemas/Instant" }
        ends_at:
          allOf:
            - $ref: "#/components/schemas/Instant"
            - description: Exclusive. Must be after `starts_at`.
        offer:
          description: |
            The priced offer the customer reviewed. The server recalculates and
            verifies rather than trusting a submitted amount. GATE D-10 for
            pricing units and duration-based rules.
          oneOf:
            - type: object
              additionalProperties: false
              required: [service_id]
              properties:
                service_id: { $ref: "#/components/schemas/Id" }
                tariff_version_id: { $ref: "#/components/schemas/Id" }
            - type: "null"
        comment:
          type: string
          maxLength: 1000

    # --- conflict errors ----------------------------------------------------
    SlotConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            server_time: { $ref: "#/components/schemas/Instant" }
            conflicts:
              type: array
              description: |
                The exact conflicting intervals, so the UI can refresh
                availability and preserve the user's other valid selections
                instead of discarding the form. No customer identity appears
                here.
              items: { $ref: "#/components/schemas/ResourceAllocation" }

    ReservationConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            server_time:
              allOf:
                - $ref: "#/components/schemas/Instant"
                - description: |
                    Lets the client explain *why* a decision failed — whether
                    the hold had expired — without guessing from its own clock.
            current_state: { $ref: "#/components/schemas/ReservationState" }
