[project]
name = "crm-backend"
version = "0.1.0"
description = "ACE / CSKA tennis-centre CRM — server API and domain logic"
requires-python = ">=3.13"

# Pinned to exact versions, not ranges. INF-00 requires reproducible builds:
# a floating constraint means the restore drill and CI can disagree with what
# a developer actually ran.
dependencies = [
    "fastapi==0.120.4",
    "uvicorn[standard]==0.41.0",
    "sqlalchemy==2.0.46",
    "alembic==1.17.1",
    "psycopg[binary]==3.2.12",
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.14.2",
    "mypy==1.18.2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    # Assert is how pytest expresses expectations.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Alembic generates migrations with its own conventions.
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
# SQLAlchemy's declarative base needs its plugin to typecheck cleanly.
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a real PostgreSQL. SQLite cannot validate the
# exclusion constraints, row locking or booking races this system depends on,
# so there is deliberately no in-memory fallback.
markers = [
    "integration: requires a live PostgreSQL test database",
]
asyncio_mode = "auto"
