# INF-01 — backend verification.
#
# D-01 resolved to Python on 26 October 2026, so this now covers the
# application as well as the contract.
#
# Still to come with their sprints: the concurrency tests for AC-01 to AC-03,
# which need the allocation engine from BE-06.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zero errors AND zero warnings. redocly.yaml records which rules are
      # deliberately disabled and why, so a warning here means something new.
      - name: Lint contract
        run: npx --yes @redocly/cli@2.26.0 lint

      # A contract that lints but cannot generate types is useless to the
      # frontend, so generation is exercised here. Output location comes from
      # redocly.yaml: openapi-typescript reads that file too and ignores -o
      # when it does.
      #
      # Generated twice and diffed, because the frontend commits its copy as a
      # vendored contract — a non-deterministic generator would make that copy
      # impossible to verify.
      - name: Verify type generation succeeds and is deterministic
        run: |
          set -euo pipefail
          npx --yes openapi-typescript@7.13.0
          cp api/.generated/schema.d.ts first.d.ts
          npx --yes openapi-typescript@7.13.0
          diff -u first.d.ts api/.generated/schema.d.ts
          test -s api/.generated/schema.d.ts
          echo "Type generation succeeds and is deterministic."

      # Guards the convention that a breaking change takes a new major path
      # rather than an edit in place: the frontend builds its types from this
      # file, so a silently incompatible v1 would break it at runtime.
      - name: Assert the contract still declares /api/v1
        run: |
          set -euo pipefail
          if ! grep -q 'url: /api/v1' api/openapi.yaml; then
            echo "::error::Base path is no longer /api/v1. A breaking change needs a new major path, not an edit in place."
            exit 1
          fi

      # No secret may appear in the contract or its examples.
      - name: Scan for credentials in the contract
        run: |
          set -euo pipefail
          if grep -nEi '(password|secret|token|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/+_-]{12,}' api/openapi.yaml; then
            echo "::error::Possible credential literal in the contract."
            exit 1
          fi
          echo "No credential literals found."

  application:
    name: Lint, typecheck, test, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration tests run against real PostgreSQL. backend.md is explicit
    # that SQLite and mocks cannot validate the exclusion constraints, row
    # locking or booking races this system depends on, so there is no
    # in-memory substitute.
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: crm_test
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: ci_only_not_a_real_secret
      APP_SECRET_KEY: ci_only_not_a_real_secret
      TEST_POSTGRES_PASSWORD: ci_only_not_a_real_secret
      TEST_POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # btree_gist is created by the migration, so a bare image is enough:
      # this also proves the migration works on a database that has never seen
      # crm.infra's db/init scripts — the case a restored dump represents.
      - name: Apply migrations to an empty database
        run: alembic upgrade head

      # Models and migration history must not diverge. Without this a model
      # edit silently stops matching the schema until someone hits a runtime
      # error in production.
      - name: Assert no migration drift
        run: alembic check

      # A migration that cannot be undone is not reversible in an incident.
      # INF-06 requires a rehearsed rollback, so downgrade is exercised here
      # rather than discovered to be broken during one.
      - name: Verify downgrade and re-upgrade
        run: |
          set -euo pipefail
          alembic downgrade base
          alembic upgrade head

      - name: Test
        run: pytest -q

      - name: Typecheck
        run: mypy app

      # The image must build, and must not run migrations on start — that is
      # an explicit operator command (INF-00).
      - name: Build image
        run: docker build -t crm-backend:ci .
